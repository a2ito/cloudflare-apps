name: Auto merge

# 自分が出した PR に自動マージを予約する。
# 実際のマージは GitHub が required status checks の成功を待って行う。
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable auto merge
    # fork からの PR と、リポジトリ所有者以外が出した PR は対象にしない。
    # 外部の変更が人の目を通さず本番へ出るのを防ぐ。
    #
    # 所有者かは author_association で見る。リポジトリは a2ito 組織の持ち物で、
    # PR を出す個人アカウント (a2-ito) とログイン名が一致しないため、
    # repository_owner との比較だと常に外れる。組織のメンバーは MEMBER、
    # 個人リポジトリの持ち主は OWNER になる。
    #
    # import ラベルの付いた PR も対象にしない。アプリを履歴ごと取り込む PR は
    # squash すると数十コミットが 1 つに潰れるため、merge commit で手動で
    # マージする。自動マージは squash 固定なので任せられない。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) &&
      !contains(github.event.pull_request.labels.*.name, 'import')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
