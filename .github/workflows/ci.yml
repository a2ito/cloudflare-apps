name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい実行が始まったら、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# wrangler.jsonc と cloudflare-env.d.ts は実 ID を含む、あるいは生成物なので
# 追跡していない。検証が目的なので雛形に仮の値を入れて組み立てる。
env:
  D1_DATABASE_ID: placeholder-database-id
  APP_HOSTNAME: placeholder.example.com
  # price-tracker の画像は R2 のカスタムドメインから配る。基底 URL は next build
  # 時に埋め込まれるため、検証用の値を渡しておかないとビルドが落ちる。
  NEXT_PUBLIC_IMAGES_BASE_URL: https://images.placeholder.example.com
  # sakelog / tabilog の写真も同じく R2 のカスタムドメインから配る。
  NEXT_PUBLIC_PHOTOS_BASE_URL: https://photos.placeholder.example.com

jobs:
  # 変更のあったアプリだけを後続の job に渡す。1 アプリの CSS を直しただけで
  # 全アプリのビルドが回るのを避ける。
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          # PR は base との差分、push は 1 つ前との差分を見る。
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          all_apps() {
            for d in apps/*/; do basename "$d"; done
          }

          # base が辿れないとき (ブランチの初回 push など) は全アプリを対象にする。
          if [ -z "${BASE_SHA:-}" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'base を辿れないため全アプリを対象にする'
            apps=$(all_apps)
          else
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "変更されたファイル:"
            echo "$changed" | sed 's/^/  /'

            # apps/ の外 (ルートの package.json、workflow など) が変わったら
            # 影響範囲が読めないので全アプリを回す。terraform/ はアプリのビルドに関わらないので除く
            # （terraform ジョブが見る）。
            changed=$(echo "$changed" | grep -v '^terraform/' || true)
            if echo "$changed" | grep -v '^$' | grep -qv '^apps/'; then
              echo 'apps/ の外に変更があるため全アプリを対象にする'
              apps=$(all_apps)
            else
              apps=$(echo "$changed" | grep '^apps/' | cut -d/ -f2 | sort -u || true)
            fi
          fi

          # 消えたアプリを拾わないよう、実在するものだけに絞る。
          existing=$(for a in $apps; do [ -d "apps/$a" ] && echo "$a"; done)

          echo "対象アプリ: ${existing:-なし}"
          # 空のまま printf に渡すと [""] になる（terraform/ だけの変更で起きる）ため、空行を落とす。
          json=$(printf '%s\n' $existing | jq -R . | jq -sc 'map(select(. != ""))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  quality:
    name: quality (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Cloudflare Workers Builds も npm ci を使うため、ここでも ci で検証する
      - run: npm ci --no-audit --no-fund
      # typecheck は Cloudflare のバインディング型を要求するアプリがある。
      # 型は wrangler.jsonc から作られるので、設定の生成が先に来る。
      - run: npm run cf:config --if-present -w apps/${{ matrix.app }}
      - run: npm run cf-typegen --if-present -w apps/${{ matrix.app }}
      - run: npm run lint --if-present -w apps/${{ matrix.app }}
      - run: npm run typecheck --if-present -w apps/${{ matrix.app }}
      - run: npm run test --if-present -w apps/${{ matrix.app }}

  build:
    name: build (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Cloudflare Workers Builds も npm ci を使うため、ここでも ci で検証する
      - run: npm ci --no-audit --no-fund
      # next build はアプリ全体を毎回コンパイルし直す。games のように 1 アプリへ
      # 複数の画面を載せていると、1 画面を直しただけで残り全部が再コンパイルになる。
      # .next/cache を持ち越すと、変わっていない部分はコンパイル結果を使い回せる。
      # key に sha を含めて毎回書き戻し、読み出しは restore-keys で直近のものに落とす。
      - name: Next.js のビルドキャッシュ
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: next-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-
            next-${{ matrix.app }}-
      # cf:build が wrangler.jsonc と型定義の生成まで面倒を見る
      - run: npm run cf:build -w apps/${{ matrix.app }}

  # terraform/ の整形と構文。state と Cloudflare には触らない（plan / apply は手元で行う）。
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ruleset の必須チェックに指定する集約ジョブ。quality と build は変更のあった
  # アプリだけ matrix で作るためジョブ名が毎回変わり、必須チェックに指定できない。
  # 対象アプリが無く両方が skipped になった場合は成功として扱う。
  ci-result:
    name: ci-result
    needs: [changes, quality, build, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "結果: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "失敗したジョブがある: $r"; exit 1 ;;
            esac
          done
