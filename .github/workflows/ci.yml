name: CI

on:
  pull_request:
  push:
    branches: [main]

# どの job もリポジトリを読むだけ。GITHUB_TOKEN の既定の権限に頼らず、明示して最小にする
permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 本番の D1 の ID と公開ホスト名はリポジトリに含めず、cloudflare.config.ts が本番ビルドで環境変数から読む。
# 検証が目的なので仮の値を渡す。
env:
  # 本番ビルドでこの ID を使う。起動確認（smoke-test.sh）のローカルのマイグレーションが
  # 当たる ID（scripts/d1.mjs の LOCAL_D1_DATABASE_ID）と揃える。cf は UUID v4 の形しか受け付けない
  D1_DATABASE_ID: 00000000-0000-4000-8000-000000000000
  APP_HOSTNAME: placeholder.example.com
  # price-tracker の画像は R2 のカスタムドメインから配る。基底 URL は next build
  # 時に埋め込まれるため、検証用の値を渡しておかないとビルドが落ちる。
  NEXT_PUBLIC_IMAGES_BASE_URL: https://images.placeholder.example.com
  # sakelog / tabilog の写真も同じく R2 のカスタムドメインから配る。
  NEXT_PUBLIC_PHOTOS_BASE_URL: https://photos.placeholder.example.com

jobs:
  # 変更のあったアプリだけを後続の job に渡す。1 アプリの CSS を直しただけで
  # 全アプリのビルドが回るのを避ける。
  changes:
    name: changes
    # 全ジョブ GitHub-hosted。public リポジトリは GitHub-hosted の分数に上限が無いため、
    # self-hosted に載せる理由が無い。CodeBuild（Lambda）と Cloud Run の runner も試したが、
    # 起動待ちが長く（Cloud Run で 1 段 1.5 分以上）、遅くなるだけだった（#106〜#108）。
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          # PR は base との差分、push は 1 つ前との差分を見る。
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          all_apps() {
            for d in apps/*/; do basename "$d"; done
          }

          # base が辿れないとき (ブランチの初回 push など) は全アプリを対象にする。
          if [ -z "${BASE_SHA:-}" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'base を辿れないため全アプリを対象にする'
            apps=$(all_apps)
          else
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "変更されたファイル:"
            while IFS= read -r f; do echo "  $f"; done <<< "$changed"

            # apps/ の外 (ルートの package.json、workflow など) が変わったら
            # 影響範囲が読めないので全アプリを回す。terraform/ はアプリのビルドに関わらないので除く
            # （terraform ジョブが見る）。
            changed=$(echo "$changed" | grep -v '^terraform/' || true)
            if echo "$changed" | grep -v '^$' | grep -qv '^apps/'; then
              echo 'apps/ の外に変更があるため全アプリを対象にする'
              apps=$(all_apps)
            else
              apps=$(echo "$changed" | grep '^apps/' | cut -d/ -f2 | sort -u || true)
            fi
          fi

          # 消えたアプリを拾わないよう、実在するものだけに絞る。
          existing=$(for a in $apps; do [ -d "apps/$a" ] && echo "$a"; done)

          echo "対象アプリ: ${existing:-なし}"
          # existing は 1 行に 1 アプリ。空のまま渡すと [""] になる（terraform/ だけの変更で起きる）ため、空行を落とす。
          json=$(printf '%s\n' "$existing" | jq -R . | jq -sc 'map(select(. != ""))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  quality:
    name: quality (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # Cloudflare Workers Builds も npm ci を使うため、ここでも ci で検証する
      - run: npm ci --no-audit --no-fund
      # typecheck は Cloudflare のバインディング型を要求するアプリがある。
      # cf-typegen が cloudflare.config.ts から型を作る。
      - run: npm run cf-typegen --if-present -w apps/${{ matrix.app }}
      - run: npm run lint --if-present -w apps/${{ matrix.app }}
      - run: npm run typecheck --if-present -w apps/${{ matrix.app }}
      - run: npm run test --if-present -w apps/${{ matrix.app }}

  build:
    name: build (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # Cloudflare Workers Builds も npm ci を使うため、ここでも ci で検証する
      - run: npm ci --no-audit --no-fund
      # cf:build は vite build を流す（環境変数を読むアプリは、先に揃っているかを確かめる）
      - run: npm run cf:build -w apps/${{ matrix.app }}
      # ビルドは通っても Worker が起動時に落ちる（本番で全リクエストが Error 1101）ことがある。
      # workerd で起動して / を開き、5xx にならないことを確かめる。Renovate の PR もここで止まる
      - name: 起動確認
        working-directory: apps/${{ matrix.app }}
        run: ../../scripts/smoke-test.sh

  # terraform/ の整形と構文。state と Cloudflare には触らない（plan / apply は手元で行う）。
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      # 手元（tfenv）と同じ版を使う。新しい版で state を書くと、手元の古い版で読めなくなる
      - name: Resolve Terraform version
        id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ruleset の必須チェックに指定する集約ジョブ。quality と build は変更のあった
  # アプリだけ matrix で作るためジョブ名が毎回変わり、必須チェックに指定できない。
  # 対象アプリが無く両方が skipped になった場合は成功として扱う。
  ci-result:
    name: ci-result
    needs: [changes, quality, build, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "結果: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "失敗したジョブがある: $r"; exit 1 ;;
            esac
          done
