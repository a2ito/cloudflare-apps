name: terraform apply

# main への push（PR の merge）で terraform/ を plan し、差分があれば apply する。
# PR の plan は ci.yml の terraform-plan job が行う。
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  # apply が途中で落ちたときに、main のまま再実行するため
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # state が GCS にあるため GCP へ OIDC で入る

jobs:
  apply:
    # apply 用の SA は sub が refs/heads/main のときだけなりすませる。
    # workflow_dispatch で別のブランチを選んでも認証で落ちるが、手前で止める。
    # job に environment を付けると sub が変わり認証が通らなくなる（cloud-management の
    # gcp/bootstrap/config_cloudflare_apps_ci.tf も直す必要がある）
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # apply を並べない。cancel-in-progress を false にして、実行中の apply を途中で打ち切らない
    # （state が中途半端になる）。待っている実行は新しい push で置き換わるが、新しいほうが
    # 最新の main を apply するので取りこぼしはない
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Terraform version
        id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      # apply 用の SA は cloudflare-apps の state とロックだけを書ける。作るのは cloud-management の gcp/bootstrap
      - name: Configure GCP credentials (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          # wrapper は stdout を包むため、-detailed-exitcode の終了コードを扱いにくくなる
          terraform_wrapper: false

      # PR の plan と同じ Secret から復元する。Secret は末尾の改行が落ちるため、改行を足して書き出す
      - name: Restore terraform.tfvars
        env:
          TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: terraform init
        run: terraform init -input=false

      # -detailed-exitcode: 0 = 差分なし、1 = エラー、2 = 差分あり。差分が無ければ apply しない
      - name: terraform plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Workers Builds の API はユーザーのトークンしか受け付けない
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      # plan と apply の間に main が進んでも、apply するのはこの plan の内容だけ
      - name: terraform apply
        if: steps.plan.outputs.exitcode == '2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Summary
        if: always()
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$PLAN_EXITCODE" in
            0) result="差分なし（apply せず）" ;;
            2) result="apply: ${JOB_STATUS}" ;;
            *) result="plan 失敗" ;;
          esac
          {
            echo "## terraform apply: ${result}"
            echo
            echo '<details><summary>plan</summary>'
            echo
            echo '```terraform'
            tail -c 60000 plan.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
