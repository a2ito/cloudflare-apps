# Trivy で見送る脆弱性。理由と、見直す期限（expired_at を過ぎると再び検出される）を書く
vulnerabilities:
  - id: CVE-2025-64756 # GHSA-5j98-mcp5-4vw2
    paths:
      - package-lock.json
    statement: >-
      glob の CLI（-c/--cmd）のコマンドインジェクション。glob 10.3.3 は @opennextjs/aws → @node-minify/core が
      完全一致の版で引くもので、ライブラリとして使うだけで CLI は動かない。npm の overrides は既存の lockfile に
      効かなかった（#128）。OpenNext が @node-minify/core を上げたら外す
    expired_at: 2027-01-17
